<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECF0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="description" content="Waggler: a fishing log for UK anglers. Catches, photos, PBs, venues and weather.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Waggler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app. Sticky header, fixed tab bar at the bottom,
   forms and detail views slide up as full-height sheets. Float-tip orange is
   the only loud colour; everything else sits in reed and water greens. */
:root{
  --bg:#ECF0EB; --surface:#FFFFFF; --sunk:#E1E8E2; --ink:#14201A; --muted:#55645C; --line:#CDD7CF;
  --accent:#C2410C; --accent-ink:#FFFFFF; --water:#1D5852; --water-soft:#D3E5E0;
  --good:#2E7A3D; --warn:#A86A12; --bad:#B42318; --shadow:0 1px 2px rgba(20,32,26,.06),0 6px 20px rgba(20,32,26,.07);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201C; --sunk:#111915; --ink:#E5ECE7; --muted:#93A39A; --line:#2A3631;
  --accent:#FF6B35; --accent-ink:#1A0D07; --water:#6CC0B4; --water-soft:#1C3330;
  --good:#6BCB7E; --warn:#E3A847; --bad:#FF8A7A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201C; --sunk:#111915; --ink:#E5ECE7; --muted:#93A39A; --line:#2A3631;
  --accent:#FF6B35; --accent-ink:#1A0D07; --water:#6CC0B4; --water-soft:#1C3330;
  --good:#6BCB7E; --warn:#E3A847; --bad:#FF8A7A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:620px;margin:0 auto;min-height:100%;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px}
.top-row{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand h1{font:700 26px/1 var(--f-display);letter-spacing:-.02em;margin:0}
.brand .sub{font-size:12px;color:var(--muted);letter-spacing:.02em}
.mark{width:34px;height:34px;flex:none}
.brand h1{font-size:30px}
.wl{display:inline-block;width:.36em;height:1.08em;vertical-align:-.22em;margin:0 -.01em 0 .01em}
.top .btn{flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}
a.btn{text-decoration:none;color:inherit}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);min-height:58px}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--accent)}
.tab.add{color:var(--ink)}
.tab.add .plus{width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.tab.add .plus svg{width:26px;height:26px}

/* content */
main{display:flex;flex-direction:column;gap:18px;padding-block:6px 20px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.section-h h2{font:700 19px/1.2 var(--f-display);margin:0;letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--water-soft);color:var(--ink);font-size:14px}
.banner.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.banner.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.banner p{margin:0;min-width:0;flex:1 1 220px}

.season{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.season div{background:var(--surface);padding:12px 12px 10px;min-width:0}
.season b{display:block;font:600 17px/1.2 var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.season span{font-size:12px;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip svg{width:16px;height:16px}
.chips.wrap{flex-wrap:wrap;overflow:visible}

.month-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px -6px}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%;min-width:0}
.card:active{transform:scale(.995)}
.thumb{width:84px;height:84px;flex:none;border-radius:10px;background:var(--water-soft);overflow:hidden;display:grid;place-items:center;color:var(--water)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:44px;height:44px;opacity:.8}
.card-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;justify-content:center}
.card-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card-title strong{font:700 17px/1.2 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-title .num{font-size:15px;font-weight:600;flex:none}
.meta{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.badge.pb{background:var(--accent);color:var(--accent-ink)}
.badge.ex{background:var(--water-soft);color:var(--water)}

.row-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.datebox{width:52px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.datebox b{display:block;font:700 24px/1 var(--f-display)}
.datebox span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row-main{min-width:0;flex:1}
.row-main strong{display:block;font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-side{text-align:right;flex:none}
.row-side b{display:block;font:600 15px var(--f-data)}
.row-side span{font-size:12px;color:var(--muted)}
.cond-icons{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.cond-icons svg{width:16px;height:16px}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:34px 16px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.empty svg.big{width:120px;height:70px;color:var(--water)}
.empty h3{font:700 19px var(--f-display);margin:0}
.empty p{margin:0;max-width:34ch;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{font:700 16px var(--f-display);margin:0 0 10px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table td,.table th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.table th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.table tr:last-child td{border-bottom:0}
.table td.r,.table th.r{text-align:right;white-space:nowrap}
.table tr[data-open]{cursor:pointer}
.scrollx{overflow-x:auto}

.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bar i{display:block;width:100%;border-radius:4px 4px 1px 1px;background:var(--water);min-height:2px}
.bar i.hi{background:var(--accent)}
.bar span{font-size:10.5px;color:var(--muted);font-family:var(--f-data)}
.bar em{font-style:normal;font-size:10.5px;font-family:var(--f-data);color:var(--ink)}
.hbar{display:grid;grid-template-columns:minmax(0,9rem) 1fr auto;align-items:center;gap:10px;font-size:14px;padding:5px 0}
.hbar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--water);border-radius:5px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet-head .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
.sheet-head h2{font:700 19px var(--f-display);margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body .in{max-width:620px;margin:0 auto;padding-block:16px 28px;display:flex;flex-direction:column;gap:18px}
.sheet-foot{border-top:1px solid var(--line);background:var(--surface);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.sheet-foot .in{max-width:620px;margin:0 auto;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sheet-foot .in .grow{flex:1}

/* forms */
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
legend{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lab{font-size:13px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{
  width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.unit{position:relative}
.unit input{padding-right:40px}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.weight-big input{font:600 22px var(--f-data);text-align:center}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--sunk);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.ph button svg{width:14px;height:14px}
.phbtns{display:flex;gap:10px;flex-wrap:wrap}
.phbtns .btn{flex:1 1 140px}
.phbtns .btn svg{color:var(--accent)}
.addph{aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;background:var(--surface);text-align:center;padding:6px}
.addph svg{width:26px;height:26px;color:var(--accent)}
.addph input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.locline{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.locline svg{width:18px;height:18px;flex:none;color:var(--water);margin-top:1px}
.idline{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--water-soft)}

/* detail */
.hero{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r)}
.hero img{width:100%;flex:none;scroll-snap-align:start;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);background:var(--sunk);max-width:100%}
.hero .ph-empty{width:100%;aspect-ratio:16/9;border-radius:var(--r);background:var(--water-soft);display:grid;place-items:center;color:var(--water)}
.hero .ph-empty svg{width:140px;height:80px}
.big-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.big-title h3{font:700 30px/1.05 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.big-title .num{font-size:24px;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{padding:10px 12px;min-width:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.facts dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.facts div.full{grid-column:1/-1}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.cardprev{width:100%;max-width:100%;border-radius:var(--r);box-shadow:var(--shadow)}

.spref{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.spref img{width:112px;aspect-ratio:3/2;object-fit:contain;background:var(--water-soft);border-radius:8px;flex:none;max-width:100%}
.spref div{min-width:0;display:flex;flex-direction:column;gap:2px}
.spref .hint a,.refhero figcaption a{color:inherit}
.refhero{margin:0;width:100%;display:flex;flex-direction:column;gap:6px}
.refhero img{width:100%;aspect-ratio:16/9;object-fit:contain;border-radius:var(--r);background:var(--water-soft);padding:8px;max-width:100%}
.idbtn{display:block;border:0;padding:0;margin:0;background:none;cursor:pointer;border-radius:8px;flex:none;width:auto;max-width:100%}
.refhero .idbtn{width:100%}
.idbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.idbox p{margin:0}
.idbox h4{margin:4px 0 0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.idbox ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.refhero figcaption{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.thumb img.ref{object-fit:contain;padding:4px}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.gtile{display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;padding:0;min-width:0}
.gtile img,.gtile .gnone{width:100%;aspect-ratio:3/2;object-fit:contain;padding:4px;border-radius:10px;background:var(--water-soft);display:grid;place-items:center;color:var(--water);max-width:100%}
.gtile .gnone svg{width:46px;height:26px}
.gtile b{font-size:14px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtile span{font-size:12px;color:var(--muted)}
.cl-sum{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;cursor:pointer}
.meter{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px}
.cl-head{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:4px 10px}
.cl-head b{font-size:34px;line-height:1}
.cl-head b span{font-size:18px;color:var(--muted)}
.cl-head>span{color:var(--muted);font-weight:600}
.cl-head .meter{grid-column:1/-1;margin-top:6px}
.cl-group{display:flex;flex-direction:column;gap:8px}
.cl-group h2{font:700 17px var(--f-display);margin:0}
.cl-body{display:flex;flex-direction:column;gap:20px}
.cl-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cl-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;min-height:60px}
.cl-row:last-child{border-bottom:0}
.cl-row input{width:24px;height:24px;flex:none;accent-color:var(--accent)}
.cl-row img,.cl-row .cl-none{width:66px;aspect-ratio:3/2;object-fit:contain;border-radius:6px;flex:none;background:var(--water-soft);display:grid;place-items:center;color:var(--water);max-width:100%}
.cl-row .cl-none svg{width:30px;height:18px}
.cl-row:not(.on) img{filter:grayscale(.85);opacity:.7}
.cl-txt{display:flex;flex-direction:column;min-width:0}
.cl-txt b{font-size:15px}
.cl-txt span{font-size:12.5px;color:var(--muted)}
.cl-row.on .cl-txt span{color:var(--good)}
.cl-body[data-show="todo"] .cl-row.on,.cl-body[data-show="done"] .cl-row:not(.on){display:none}
.wxrow{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.wxrow .hint a{color:inherit}

/* sunrise / sunset (sunrise equation) and moon phase, worked out on the phone */
function sunTimes(date, lat, lon) {
  const rad = Math.PI / 180;
  const ms = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 12);
  const n = Math.round(ms / 864e5 + 2440587.5 - 2451545.0 + 0.0008);
  const Js = n - lon / 360;
  const M = ((357.5291 + 0.98560028 * Js) % 360 + 360) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545.0 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);

/* ---------------------------------------------------------------- phone storage
   Everything is kept on this phone in IndexedDB, so the app works with no signal.
   These objects copy the small part of the old Claude storage API the app uses. */
const IDB = {
  db: null,
  open() {
    return new Promise((ok, no) => {
      const r = indexedDB.open("bankside", 1); // storage keeps its original name so existing catches carry over
      r.onupgradeneeded = () => { for (const s of ["catches", "sessions", "venues", "settings", "photos"]) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: "id" }); };
      r.onsuccess = () => { IDB.db = r.result; ok(); };
      r.onerror = () => no(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((ok, no) => {
      const t = IDB.db.transaction(store, mode); const st = t.objectStore(store); let out;
      const q = fn(st); if (q) q.onsuccess = () => { out = q.result; };
      t.oncomplete = () => ok(out); t.onerror = () => no(t.error); t.onabort = () => no(t.error || new Error("aborted"));
    });
  },
  all: s => IDB.tx(s, "readonly", st => st.getAll()),
  get: (s, id) => IDB.tx(s, "readonly", st => st.get(id)),
  put: (s, v) => IDB.tx(s, "readwrite", st => st.put(v)),
  del: (s, id) => IDB.tx(s, "readwrite", st => st.delete(id)),
  clear: s => IDB.tx(s, "readwrite", st => st.clear())
};
const LocalDB = (() => {
  const subs = [];
  const snap = rows => ({ docs: rows.map(r => { const { id, ...d } = r; return { id, exists: true, data: () => d }; }) });
  async function notify(store) {
    for (const s of subs) {
      if (s.store !== store) continue;
      if (s.kind === "col") s.cb(snap(await IDB.all(store)));
      else { const r = await IDB.get(store, s.id); s.cb(r ? { id: s.id, exists: true, data: () => { const { id, ...d } = r; return d; } } : { id: s.id, exists: false, data: () => undefined }); }
    }
  }
  const docRef = (store, id) => ({
    id,
    set: async d => { await IDB.put(store, { ...JSON.parse(JSON.stringify(d)), id }); await notify(store); },
    update: async d => { const cur = await IDB.get(store, id); if (!cur) throw { code: "invalid_argument" }; await IDB.put(store, { ...cur, ...JSON.parse(JSON.stringify(d)), id }); await notify(store); },
    delete: async () => { await IDB.del(store, id); await notify(store); },
    get: async () => { const r = await IDB.get(store, id); return { id, exists: !!r, data: () => r }; },
    onSnapshot: cb => { subs.push({ kind: "doc", store, id, cb }); notify(store); return () => {}; }
  });
  return {
    collection: store => ({ doc: id => docRef(store, id || uid()), onSnapshot: cb => { subs.push({ kind: "col", store, cb }); notify(store); return () => {}; } }),
    doc: path => { const [store, id] = path.split("/"); return docRef(store, id); },
    notify
  };
})();

const PHOTO_URLS = {};
async function photoBlob(id) { const r = await IDB.get("photos", id); return r ? r.blob : null; }
async function loadPhotoUrls(ids) {
  let changed = false;

  }

}
const LocalAssets = {
  async upload(blob) { const id = uid(); await IDB.put("photos", { id, blob, createdAt: new Date().toISOString() }); PHOTO_URLS[id] = URL.createObjectURL(blob); return { id, url: PHOTO_URLS[id] }; },
  async delete(id) { await IDB.del("photos", id); if (PHOTO_URLS[id]) { URL.revokeObjectURL(PHOTO_URLS[id]); delete PHOTO_URLS[id]; } return { deleted: true }; }
};
const LocalDownloads = {
  async save({ filename, data }) {
    const type = filename.endsWith(".csv") ? "text/csv" : filename.endsWith(".json") ? "application/json" : "image/jpeg";
    const blob = data instanceof Blob ? data : new Blob([data], { type });

/* ---------------------------------------------------------------- weather (Open-Meteo) */
const WX_VARS = "temperature_2m,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m";
function skyFrom(code, cloud) {
  if (code == null) return null;
  if (code === 0) return "sun";
  if (code === 1 || code === 2) return cloud != null && cloud < 30 ? "sun" : "bright";
  if (code === 3) return "cloud";
  if (code === 45 || code === 48) return "fog";
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "frost";
  if (code >= 80 && code <= 82) return "showers";
  if ((code >= 51 && code <= 67) || code >= 95) return "rain";
  return null;
}
function windWord(mph) { if (mph == null) return null; if (mph < 3) return "Calm"; if (mph < 8) return "Light"; if (mph < 19) return "Breezy"; return "Strong"; }
function dirWord(deg) { if (deg == null) return null; return DIRS[Math.round(((deg % 360) + 360) % 360 / 45) % 8]; }
async function getWeather(lat, lon, whenLocal) {
  const when = whenLocal || nowLocal();
  const day = when.slice(0, 10), hr = +when.slice(11, 13) || 12;
  const d0 = new Date(day + "T12:00:00"); const prev = new Date(d0.getTime() - 864e5);
  const prevDay = `${prev.getFullYear()}-${pad(prev.getMonth() + 1)}-${pad(prev.getDate())}`;
  const ageDays = (Date.now() - d0.getTime()) / 864e5;
  const host = ageDays > 80 ? "https://archive-api.open-meteo.com/v1/archive" : "https://api.open-meteo.com/v1/forecast";
  const url = `${host}?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&hourly=${WX_VARS}&wind_speed_unit=mph&timezone=auto&start_date=${prevDay}&end_date=${day}`;
  const r = await fetch(url); if (!r.ok) throw new Error("weather " + r.status);
  const j = await r.json(); const h = j.hourly || {};
  const i = (h.time || []).indexOf(`${day}T${pad(hr)}:00`); if (i < 0) throw new Error("no hour");
  const v = k => (h[k] && h[k][i] != null) ? h[k][i] : null;
  const p = v("pressure_msl"), p3 = (h.pressure_msl && i >= 3) ? h.pressure_msl[i - 3] : null;
  const trend = p != null && p3 != null ? (p - p3 >= 1 ? "Rising" : p3 - p >= 1 ? "Falling" : "Steady") : null;
  const cond = { sky: skyFrom(v("weather_code"), v("cloud_cover")), wind: windWord(v("wind_speed_10m")), windDir: dirWord(v("wind_direction_10m")),
    airC: v("temperature_2m") != null ? Math.round(v("temperature_2m") * 10) / 10 : null, pressure: p != null ? Math.round(p) : null, trend };
  for (const k in cond) if (cond[k] == null) delete cond[k];
  return { cond, hour: `${pad(hr)}:00`, windMph: v("wind_speed_10m") };
}
const WX_CREDIT = `Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>`;

/* ---------------------------------------------------------------- backup and restore */
function blobToDataUrl(b) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(r.error); r.readAsDataURL(b); }); }
async function dataUrlToBlob(u) { return await (await fetch(u)).blob(); }
async function makeBackup() {
  const out = { app: "waggler", format: 1, exported: new Date().toISOString(), catches: await IDB.all("catches"), sessions: await IDB.all("sessions"), venues: await IDB.all("venues"), settings: await IDB.all("settings"), photos: {} };
  for (const p of await IDB.all("photos")) out.photos[p.id] = await blobToDataUrl(p.blob);
  return JSON.stringify(out);
}
async function restoreBackup(text) {
  const j = JSON.parse(text);
  if (j.app !== "waggler" && j.app !== "bankside") throw new Error("not a Waggler backup");
  for (const s of ["catches", "sessions", "venues", "settings", "photos"]) await IDB.clear(s);
  for (const s of ["catches", "sessions", "venues", "settings"]) for (const row of j[s] || []) await IDB.put(s, row);
  for (const [id, u] of Object.entries(j.photos || {})) await IDB.put("photos", { id, blob: await dataUrlToBlob(u) });
  for (const k of Object.keys(PHOTO_URLS)) { URL.revokeObjectURL(PHOTO_URLS[k]); delete PHOTO_URLS[k]; }
  for (const s of ["catches", "sessions", "venues", "settings"]) await LocalDB.notify(s);
}

  }

function countBy(arr, key) { const m = new Map(); for (const x of arr) { const k = typeof key === "function" ? key(x) : x[key]; if (!k) continue; m.set(k, (m.get(k) || 0) + 1); } return [...m.entries()].sort((a, b) => b[1] - a[1]); }

  h += `<div class="panel"><h3>Backup</h3><p class="hint" style="margin:0 0 10px">Your log is stored on this phone only. A backup file holds every catch and photo. Keep a copy in Google Drive or email it to yourself.${S.settings.lastBackup ? " Last backup: " + esc(fmtDate(S.settings.lastBackup)) + "." : ""}</p>

  return h;

/* ---------------------------------------------------------------- sheets */
function openSheet({ title, body, foot = "", onMount, refresh }) {
  const el = document.createElement("div");
  el.className = "sheet"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", title);
  el.innerHTML = `<div class="sheet-head wrap"><div class="in"><button class="iconbtn" data-close aria-label="Back">${I.back}</button><h2>${esc(title)}</h2></div></div>
    <div class="sheet-body"><div class="in wrap">${body}</div></div>${foot ? `<div class="sheet-foot wrap"><div class="in">${foot}</div></div>` : ""}`;
  document.body.appendChild(el);
  const entry = { el, refresh: null };
  S.stack.push(entry);
  el.addEventListener("click", e => { if (e.target.closest("[data-close]")) closeSheet(entry); });
  if (onMount) onMount(el, entry);
  if (refresh) { entry.refresh = () => { if (!document.body.contains(el)) return; const r = refresh(); if (r === false) closeSheet(entry); }; }
  return entry;
}
function closeSheet(entry) {
  const i = S.stack.indexOf(entry); if (i < 0) return;
  S.stack.splice(i, 1); entry.el.remove(); if (entry.onClose) entry.onClose();
}
function setBody(entry, html) { $(".sheet-body .in", entry.el).innerHTML = html; }
function armDelete(btn, fn) {
  if (btn.dataset.armed) { fn(); return; }
  btn.dataset.armed = "1"; btn.classList.add("armed"); const old = btn.textContent; btn.textContent = "Tap again to delete";
  setTimeout(() => { if (!btn.isConnected) return; delete btn.dataset.armed; btn.classList.remove("armed"); btn.textContent = old; }, 4000);
}

/* ------------------------------------------------------------- db helpers */
function dbErr(e) {
  const c = e && e.code;
  if (c === "quota_exceeded") return "Your log is full. Delete some old entries to add more.";
  if (c === "invalid_argument") return "That couldn't be saved. Only the log's owner can add or change entries.";
  if (c === "revoked" || c === "not_granted") return "Saving isn't available here any more. Reload the page.";
  return "That didn't save. Check your signal and try again.";
}
async function write(fn) { try { return await fn(); } catch (e) { if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); return await fn(); } throw e; } }

    </div>

      <div class="field"><span class="lab">Water colour</span>${chipset("clarity", CLARITY, cond.clarity)}</div>

    </div>
    <div class="grid2">
      <div class="field"><label for="${prefix}-pressure">Air pressure</label><div class="unit"><input id="${prefix}-pressure" type="text" inputmode="numeric" value="${cond.pressure ?? ""}"><span>mb</span></div></div>
      <div class="field"><span class="lab">Pressure over 3 hours</span>${chipset("trend", ["Rising","Steady","Falling"], cond.trend)}</div>

function wireChips(root) {
  root.addEventListener("click", e => {
    const b = e.target.closest("[data-group] .chip"); if (!b) return;
    const g = b.closest("[data-group]"); const on = b.getAttribute("aria-pressed") === "true";
    $$(".chip", g).forEach(x => x.setAttribute("aria-pressed", "false"));
    if (!on) b.setAttribute("aria-pressed", "true");
  });
}
function readCond(root, prefix = "c") {
  const pick = n => $(`[data-group="${prefix}-${n}"] .chip[aria-pressed="true"]`, root)?.dataset.val || null;
  const o = { sky: pick("sky"), wind: pick("wind"), windDir: $(`#${prefix}-dir`, root).value || null, airC: num($(`#${prefix}-air`, root).value), waterC: num($(`#${prefix}-water`, root).value), clarity: pick("clarity"), level: pick("level"), pressure: num($(`#${prefix}-pressure`, root).value), trend: pick("trend") };
  for (const k in o) if (o[k] == null || o[k] === "") delete o[k];
  return o;
}
function setCond(root, cond = {}, prefix = "c") {
  for (const n of ["sky","wind","clarity","level","trend"]) $$(`[data-group="${prefix}-${n}"] .chip`, root).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === cond[n])));
  $(`#${prefix}-dir`, root).value = cond.windDir || ""; $(`#${prefix}-air`, root).value = cond.airC ?? ""; $(`#${prefix}-water`, root).value = cond.waterC ?? ""; $(`#${prefix}-pressure`, root).value = cond.pressure ?? "";
}
function venueOptions(sel) {

function nearestVenue(lat, lon) {
  let best = null;
  for (const v of S.venues) if (v.lat != null) { const d = haversineKm(lat, lon, v.lat, v.lon); if (!best || d < best.d) best = { v, d }; }
  return best;

  const rows = [...S.catches].sort((a, b) => (a.when || "").localeCompare(b.when || "")).map(c => {
    const oz = c.weightOz || 0, cd = c.cond || {};
    return [(c.when || "").slice(0, 10), fmtTime(c.when), c.species, oz ? Math.floor(oz / 16) : "", oz ? Math.round((oz % 16) * 10) / 10 : "", oz ? (oz * 0.028349523).toFixed(3) : "", c.lengthCm ?? "", venueName(c), c.peg, c.method, c.bait, c.rig, (SKY.find(s => s[0] === cd.sky) || [])[1], cd.wind, cd.windDir, cd.airC, cd.waterC, cd.clarity, cd.level, cd.pressure, cd.trend, c.released === false ? "no" : "yes", c.lat, c.lon, c.notes].map(q).join(",");
  });
  try { const r = await S.downloads.save({ filename: `waggler-catches-${nowLocal().slice(0, 10)}.csv`, data: [cols.join(","), ...rows].join("\n") }); if (r.status === "saved") toast("Exported"); }
  catch (e) { if (e.code !== "declined") toast("Export isn't available here."); }
}

/* ------------------------------------------------------------- examples */
async function clearExamples() {
  try {
    for (const c of S.catches.filter(x => x.example)) await write(() => col("catches").doc(c.id).delete());
    for (const s of S.sessions.filter(x => x.example)) await write(() => col("sessions").doc(s.id).delete());
    for (const v of S.venues.filter(x => x.example)) await write(() => col("venues").doc(v.id).delete());
    toast("Examples removed. Your log is ready.");
  } catch (e) { toast(dbErr(e)); }
}

/* ---------------------------------------------------------------- backup */
async function doBackup(btn) {
  if (btn) btn.disabled = true;
  try {
    const text = await makeBackup();
    await S.downloads.save({ filename: `waggler-backup-${nowLocal().slice(0, 10)}.json`, data: text });
    await saveSettings({ lastBackup: nowLocal().slice(0, 10) });
    toast("Backup saved to Downloads");
  } catch (e) { toast("The backup didn't save. Try again."); }
  finally { if (btn) btn.disabled = false; }
}
document.addEventListener("change", async e => {
  if (e.target.id !== "restore-file" || !e.target.files[0]) return;
  const file = e.target.files[0];
  let text; try { text = await file.text(); const j = JSON.parse(text); if (j.app !== "waggler" && j.app !== "bankside") throw 0; } catch (er) { toast("That file isn't a Waggler backup."); return; }
  const j = JSON.parse(text);
  openSheet({ title: "Restore backup", body: `<p style="margin:0">This backup from <b>${esc(fmtDate((j.exported || "").slice(0, 10)) || "an unknown date")}</b> has ${(j.catches || []).length} catch${(j.catches || []).length === 1 ? "" : "es"} and ${Object.keys(j.photos || {}).length} photo${Object.keys(j.photos || {}).length === 1 ? "" : "s"}.</p><p class="hint" style="margin:0">Restoring replaces everything on this phone with the backup.</p>`,
    foot: `<span class="grow"></span><button class="btn ghost" data-close>Cancel</button><button class="btn danger" id="rs-go">Replace and restore</button>`,
    onMount(el, entry) { $("#rs-go", el).onclick = async () => { const b = $("#rs-go", el); b.disabled = true; b.innerHTML = `<span class="spin"></span> Restoring`; try { await restoreBackup(text); closeSheet(entry); toast("Backup restored"); } catch (er) { toast("Restore failed. Your log may be incomplete, so try again."); b.disabled = false; b.textContent = "Replace and restore"; } }; } });
});
document.getElementById("install")?.addEventListener("click", async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; document.getElementById("install").hidden = true; });

/* --------------------------------------------------------------- events */
document.addEventListener("click", e => {
  const t = e.target;
  const tab = t.closest("[data-tab]"); if (tab) { S.view = tab.dataset.tab; S.filter = null; try { localStorage.setItem("bankside.view", S.view); } catch (er) {} render(); window.scrollTo(0, 0); return; }
  const oc = t.closest("[data-open-catch]"); if (oc) { e.preventDefault(); openCatch(oc.dataset.openCatch); return; }
  const os = t.closest("[data-open-session]"); if (os) { e.preventDefault(); openSession(os.dataset.openSession); return; }
  const ov = t.closest("[data-open-venue]"); if (ov) { e.preventDefault(); openVenue(ov.dataset.openVenue); return; }
  const ids = t.closest("[data-idsp]"); if (ids) { e.preventDefault(); e.stopPropagation(); openSpeciesId(ids.dataset.idsp); return; }
  const gd = t.closest("[data-guide]"); if (gd) { openSpecies(gd.dataset.guide); return; }
  const fl = t.closest("[data-filter]"); if (fl) { S.filter = fl.dataset.filter || null; render(); return; }
  const un = t.closest("[data-units]"); if (un && S.db) { const units = un.dataset.units; S.settings.units = units; render(); write(() => S.db.doc("settings/main").set({ ...S.settings, units })).catch(er => toast(dbErr(er))); return; }
  const a = t.closest("[data-act]"); if (!a || a.closest(".sheet")) return;
  const act = a.dataset.act;
  if (act === "new-catch") openCatchForm(null);
  else if (act === "new-session") openSessionForm(null);
  else if (act === "new-venue") openVenueForm(null);
  else if (act === "licences") openLicences();
  else if (act === "export") exportCsv();
  else if (act === "credits") openCredits();
  else if (act === "backup") doBackup(a);
  else if (act === "restore") { const i = $("#restore-file"); i.value = ""; i.click(); }
  else if (act === "checklist") openChecklist();
  else if (act === "clear-examples") { if (a.dataset.armed) clearExamples(); else { a.dataset.armed = "1"; a.textContent = "Tap again to remove"; setTimeout(() => { if (a.isConnected) { delete a.dataset.armed; a.textContent = "Remove examples"; } }, 4000); } }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.stack.length) closeSheet(S.stack[S.stack.length - 1]); });

/* ----------------------------------------------------------------- boot */
render();
(async () => {
  try { await IDB.open(); } catch (e) { S.status = "broken"; render(); return; }
  S.db = LocalDB; S.assets = LocalAssets; S.downloads = LocalDownloads; S.sample = null; S.isOwner = true;
  try { if (navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist(); } catch (e) {}
  const done = () => { if (S.loaded.catches && S.loaded.sessions && S.loaded.venues && S.status === "connecting") { S.status = "ready"; } render(); };
  const db = S.db;
  db.collection("catches").onSnapshot(async s => { S.catches = s.docs.map(d => ({ id: d.id, ...d.data() })); await loadPhotoUrls(S.catches.flatMap(c => c.photos || [])); S.loaded.catches = true; done(); });
  db.collection("sessions").onSnapshot(s => { S.sessions = s.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded.sessions = true; done(); });
  db.collection("venues").onSnapshot(s => { S.venues = s.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded.venues = true; done(); });
  db.doc("settings/main").onSnapshot(d => { S.settings = d.exists ? { units: "lboz", licences: [], ...d.data() } : { units: "lboz", licences: [] }; render(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
})();
</script>
